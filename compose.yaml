services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ptat}
      MYSQL_USER: ${MYSQL_USER:-ptat}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - ptat-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 30
  portal:
    build: .
    profiles: ["portal"]
    env_file:
      - path: .env.portal
        required: false
    environment:
      PTAT_DB_DRIVER: mysql
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ptat}
      MYSQL_USER: ${MYSQL_USER:-ptat}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      PTAT_ADMIN_PASSWORD: ${PTAT_ADMIN_PASSWORD:?Set PTAT_ADMIN_PASSWORD in .env}
      PTAT_SECURE_COOKIES: ${PTAT_SECURE_COOKIES:-false}
      PTAT_PUBLIC_ORIGIN: ${PTAT_PUBLIC_ORIGIN:-}
      PORT: 3000
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - ptat-portal:/app/.data
    depends_on:
      mysql:
        condition: service_healthy
volumes:
  ptat-mysql:
  ptat-portal:
